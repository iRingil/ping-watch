name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings → About.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      description: The address or host name traced, if the problem is with one target. Leave out anything private.
      placeholder: 1.1.1.1
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The status bar message, if there is one, helps a lot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Trace ...
        2. Click ...
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag a screenshot of the window here, if it shows the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
