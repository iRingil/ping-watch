name: Build

# Builds the installer and the portable zip on demand; the Release workflow publishes the latest successful run.
# Actions are pinned to commit SHAs (Dependabot keeps them current), and Inno Setup is a fixed release checked by its
# SHA-256: a re-pointed tag can't put foreign code into the build of the installer. No build cache: the files come
# from a clean build. The release checks (audit, rustfmt, Clippy, tests) run here too, as Release publishes only
# what Build made. The toolchain and the runner image are pinned: raise them by hand (rustc --version) together.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
      # Signed build provenance of the files (GitHub artifact attestations).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.23.0
      - name: cargo audit
        run: cargo audit
      - name: rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      # Writes the third-party license notices shipped with the app (build.cmd runs it).
      - name: Install cargo-about
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about@0.9.3
      # Inno Setup 7 is not on Chocolatey and not on the runner image: the official release, pinned and checked.
      - name: Install Inno Setup 7
        shell: pwsh
        env:
          URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
          SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
        run: |
          $installer = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest $env:URL -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $env:SHA256) { throw "Inno Setup installer hash mismatch" }
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
      # cargo build --release, the installer and the portable zip.
      - name: Build the installer and the portable zip
        shell: cmd
        run: infrastructure\inno\build.cmd
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/PingWatch-*-setup.exe
            build/PingWatch-*-portable.zip
      - name: Upload the installer and the portable zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PingWatch
          path: |
            build/PingWatch-*-setup.exe
            build/PingWatch-*-portable.zip
          if-no-files-found: error
