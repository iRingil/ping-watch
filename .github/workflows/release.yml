name: Release

# Publishes the files of the latest successful Build run of main, as they were tested, as release vX.Y.Z.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  # Reads the build provenance of the files to check it.
  attestations: read

jobs:
  release:
    # Only main's own copy of this workflow publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the latest successful build
        id: build
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --branch main --status success --limit 1 \
            --json databaseId,headSha --jq '.[0] // empty')
          if [ -z "$run" ]; then echo "::error::No successful Build run of main"; exit 1; fi
          echo "id=$(jq -r .databaseId <<< "$run")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .headSha <<< "$run")" >> "$GITHUB_OUTPUT"
      # The full history: the tags and the commits since the previous release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check that this version and this build are not released yet
        id: version
        env:
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag is released already: raise the version in Cargo.toml and build again"; exit 1
          fi
          latest=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> /dev/null || true)
          if [ -n "$latest" ] && [ "$(git rev-list -n 1 "$latest")" = "$SHA" ]; then
            echo "::error::The latest release $latest is this build's commit already"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$(git describe --tags --abbrev=0 --match 'v*' "$SHA" 2> /dev/null || true)" >> "$GITHUB_OUTPUT"
      # Artifacts are kept for 90 days: an older build has to be made again.
      - name: Download the build's files
        env:
          RUN_ID: ${{ steps.build.outputs.id }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n PingWatch -D dist; then
            echo "::error::Build run $RUN_ID has no files (expired?): run Build again"; exit 1
          fi
          for file in "PingWatch-$VERSION-setup.exe" "PingWatch-$VERSION-portable.zip"; do
            if [ ! -f "dist/$file" ]; then echo "::error::Build run $RUN_ID has no $file"; exit 1; fi
          done
      # The files must be the ones Build of this repository made (its signed provenance), not just any artifact.
      - name: Check the files' provenance and write their checksums
        env:
          SHA: ${{ steps.build.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          for file in "PingWatch-$VERSION-setup.exe" "PingWatch-$VERSION-portable.zip"; do
            gh attestation verify "$file" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --source-ref refs/heads/main --source-digest "$SHA"
          done
          sha256sum "PingWatch-$VERSION-setup.exe" "PingWatch-$VERSION-portable.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # The files are scanned before they are published. A detection by Microsoft's engine stops the release: Defender
      # would remove the program from the users' computers. What the other engines say only goes to the log (they
      # give false alarms on unsigned programs). The release notes link to the reports.
      - name: Scan the files with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "::error::The secret VT_API_KEY is not set"; exit 1; fi
          api=https://www.virustotal.com/api/v3
          # The free API takes 4 requests a minute: a wait follows every request.
          vt() { curl -sS --fail-with-body --retry 3 --retry-delay 30 -H "x-apikey: $VT_API_KEY" "$@"; sleep 20; }
          links=()
          blocked=0
          for file in "PingWatch-$VERSION-setup.exe" "PingWatch-$VERSION-portable.zip"; do
            id=$(vt -F "file=@dist/$file" "$api/files" | jq -r '.data.id // empty')
            if [ -z "$id" ]; then echo "::error::VirusTotal didn't take $file"; exit 1; fi
            status=
            for _ in $(seq 30); do
              vt "$api/analyses/$id" > analysis.json
              status=$(jq -r .data.attributes.status analysis.json)
              if [ "$status" = completed ]; then break; fi
            done
            if [ "$status" != completed ]; then
              echo "::error::VirusTotal hasn't finished with $file in 10 minutes: run Release again"; exit 1
            fi
            echo "$file: $(jq -c .data.attributes.stats analysis.json)"
            jq -r '.data.attributes.results | to_entries[]
              | select(.value.category == "malicious" or .value.category == "suspicious")
              | "  \(.key): \(.value.result)"' analysis.json
            verdict=$(jq -r '.data.attributes.results.Microsoft.category // "none"' analysis.json)
            if [ "$verdict" = malicious ] || [ "$verdict" = suspicious ]; then
              echo "::error::Microsoft's engine detects $file"; blocked=1
            fi
            case "$file" in *-setup.exe) label=installer ;; *) label="portable zip" ;; esac
            links+=("[$label](https://www.virustotal.com/gui/file/$(sha256sum "dist/$file" | cut -d ' ' -f 1))")
          done
          if [ "$blocked" = 1 ]; then exit 1; fi
          echo "**VirusTotal reports:** ${links[0]} · ${links[1]}" > virustotal.md
      # The texts come from main as it is now: a fix to them needs no new build.
      - name: Write the release notes
        env:
          SHA: ${{ steps.build.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          git show origin/main:.github/release-notes/header.md | sed "s/{version}/$VERSION/g" > notes.md
          { echo; cat virustotal.md; echo; } >> notes.md
          if git cat-file -e "origin/main:.github/release-notes/$VERSION.md" 2> /dev/null; then
            git show "origin/main:.github/release-notes/$VERSION.md" >> notes.md
          elif [ -n "$PREVIOUS" ]; then
            # Commits of people only, without the ones marked [skip changelog].
            changes=$(git log --no-merges --reverse --format='%an%x09%s' "$PREVIOUS..$SHA" \
              | awk -F '\t' '$1 !~ /\[bot\]$/ && $2 !~ /\[skip changelog\]/ { print "- " $2 }')
            printf '## Changes\n\n%s\n' "${changes:-- Small internal changes}" >> notes.md
          else
            echo "::error::The first release needs .github/release-notes/$VERSION.md"; exit 1
          fi
          cat notes.md
      - name: Publish the release
        env:
          SHA: ${{ steps.build.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$SHA" --title "Ping Watch $VERSION" \
            --notes-file notes.md --latest \
            "dist/PingWatch-$VERSION-setup.exe" "dist/PingWatch-$VERSION-portable.zip" dist/SHA256SUMS.txt
