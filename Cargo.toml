[package]
name = "ping-watch"
version = "1.3.1"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
# Not on crates.io; also keeps the app itself out of the third-party notices (about.toml).
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "7.0.0"
dns-lookup = "4.0.2"
eframe = "0.37.0"
egui_extras = "0.37.0"
egui_plot = { version = "0.38.0", default-features = false }
env_logger = "0.11.11"
log = "0.4.35"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tauri-winrt-notification = "0.8.1"
thiserror = "2.0.21"
tray-icon = "0.26.1"
ureq = "3.5.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_NetworkManagement_WindowsFirewall", "Win32_Networking_WinSock", "Win32_System_Com", "Win32_System_IO", "Win32_System_Rpc", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.100.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# Every `unsafe` block states why it is sound (ANSSI LANG-UNSAFE).
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
# Panics only where justified; propagate errors instead (ANSSI: error handling).
unwrap_used = "warn"
# Overflow must be handled explicitly (checked_/wrapping_/saturating_).
arithmetic_side_effects = "warn"
# Every module, function, type, field and constant has a doc comment, private ones included.
missing_docs_in_private_items = "warn"

[profile.release]
# Keep overflow panics in release too, so an unhandled overflow is never silent.
overflow-checks = true

[build-dependencies]
winresource = "0.1.34"
